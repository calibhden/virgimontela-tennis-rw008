<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" role="img" aria-labelledby="t2 d2">
  <title id="t2">Ilustrasi Cara Kerja Sistem Gate Otomatis dan CCTV Virgimontela</title>
  <desc id="d2">Alur kerja 4 komponen sistem gate otomatis ZKTeco dan 8 CCTV senilai Rp123,565 juta: tap kartu, kontroler, palang otomatis dengan sensor anti-jepit, dan pemantauan CCTV 24 jam.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f6f0"/>
      <stop offset="100%" stop-color="#edece2"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#1b5d49"/>
    </marker>
  </defs>

  <rect width="920" height="340" rx="22" fill="url(#bg2)"/>
  <rect x="1" y="1" width="918" height="338" rx="21" fill="none" stroke="#d5ddd8"/>

  <!-- Header -->
  <text x="34" y="38" fill="#1b5d49" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="11" font-weight="800" letter-spacing="2">CARA KERJA SISTEM GATE &amp; KEAMANAN · FINGERPRINT JAKARTA</text>
  <text x="34" y="66" fill="#14241f" font-family="Georgia, serif" font-size="23">Bagaimana paket Rp123,6 juta bekerja di 4 lajur</text>
  <rect x="692" y="24" width="194" height="44" rx="12" fill="#123c30"/>
  <text x="789" y="42" text-anchor="middle" fill="#eadcb9" font-family="ui-sans-serif, sans-serif" font-size="9.5" font-weight="800" letter-spacing="1">TOTAL SISTEM GATE</text>
  <text x="789" y="59" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-size="15" font-weight="700">Rp123.565.000</text>

  <!-- Step 1: Tap Kartu -->
  <rect x="34" y="96" width="192" height="176" rx="16" fill="#ffffff" stroke="#d5ddd8"/>
  <circle cx="62" cy="124" r="14" fill="#123c30"/>
  <text x="62" y="128" text-anchor="middle" fill="#eadcb9" font-family="ui-sans-serif, sans-serif" font-size="11" font-weight="800">01</text>
  <text x="86" y="128" fill="#123c30" font-family="ui-sans-serif, sans-serif" font-size="12" font-weight="800">Tap Kartu Akses</text>
  <!-- Icon: gooseneck + card -->
  <path d="M78 192 L78 162 Q78 152 88 152 L100 152" fill="none" stroke="#1b5d49" stroke-width="4" stroke-linecap="round"/>
  <rect x="96" y="142" width="18" height="24" rx="3" fill="#123c30"/>
  <rect x="124" y="148" width="28" height="18" rx="3" fill="#d1b26c"/>
  <line x1="128" y1="157" x2="148" y2="157" stroke="#071914" stroke-width="2"/>
  <text x="50" y="218" fill="#14241f" font-family="ui-sans-serif, sans-serif" font-size="11.5" font-weight="700">4 Tiang Gooseneck</text>
  <text x="50" y="235" fill="#5b6b64" font-family="ui-sans-serif, sans-serif" font-size="10.5">+ 4 ZKTeco Wiegand Reader</text>
  <text x="50" y="258" fill="#1b5d49" font-family="ui-sans-serif, sans-serif" font-size="11" font-weight="800">Rp11,04 jt</text>

  <!-- Arrow 1->2 -->
  <line x1="229" y1="184" x2="251" y2="184" stroke="#1b5d49" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 2: Otak Kontroler & Palang -->
  <rect x="256" y="96" width="192" height="176" rx="16" fill="#ffffff" stroke="#d5ddd8"/>
  <circle cx="284" cy="124" r="14" fill="#123c30"/>
  <text x="284" y="128" text-anchor="middle" fill="#eadcb9" font-family="ui-sans-serif, sans-serif" font-size="11" font-weight="800">02</text>
  <text x="308" y="128" fill="#123c30" font-family="ui-sans-serif, sans-serif" font-size="12" font-weight="800">Palang &amp; Kontrol</text>
  <!-- Icon: barrier gate -->
  <rect x="290" y="156" width="22" height="36" rx="3" fill="#123c30"/>
  <line x1="310" y1="164" x2="394" y2="144" stroke="#c84b31" stroke-width="5" stroke-linecap="round"/>
  <line x1="326" y1="160" x2="338" y2="157" stroke="#ffffff" stroke-width="5"/>
  <line x1="354" y1="153" x2="366" y2="150" stroke="#ffffff" stroke-width="5"/>
  <circle cx="301" cy="166" r="4" fill="#d1b26c"/>
  <text x="272" y="218" fill="#14241f" font-family="ui-sans-serif, sans-serif" font-size="11.5" font-weight="700">2 Barrier BGM2000</text>
  <text x="272" y="235" fill="#5b6b64" font-family="ui-sans-serif, sans-serif" font-size="10.5">+ 2 Controller Inbio 260 Pro</text>
  <text x="272" y="258" fill="#1b5d49" font-family="ui-sans-serif, sans-serif" font-size="11" font-weight="800">Rp51,80 jt</text>

  <!-- Arrow 2->3 -->
  <line x1="451" y1="184" x2="473" y2="184" stroke="#1b5d49" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 3: Sensor Anti-Jepit -->
  <rect x="478" y="96" width="192" height="176" rx="16" fill="#ffffff" stroke="#d5ddd8"/>
  <circle cx="506" cy="124" r="14" fill="#123c30"/>
  <text x="506" y="128" text-anchor="middle" fill="#eadcb9" font-family="ui-sans-serif, sans-serif" font-size="11" font-weight="800">03</text>
  <text x="530" y="128" fill="#123c30" font-family="ui-sans-serif, sans-serif" font-size="12" font-weight="800">Sensor Aman</text>
  <!-- Icon: radar waves + loop -->
  <path d="M532 184 Q554 146 576 184" fill="none" stroke="#d1b26c" stroke-width="2.5"/>
  <path d="M542 184 Q554 162 566 184" fill="none" stroke="#1b5d49" stroke-width="2.5"/>
  <ellipse cx="554" cy="188" rx="34" ry="8" fill="none" stroke="#123c30" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="494" y="218" fill="#14241f" font-family="ui-sans-serif, sans-serif" font-size="11.5" font-weight="700">2 Radar + 2 Loop</text>
  <text x="494" y="235" fill="#5b6b64" font-family="ui-sans-serif, sans-serif" font-size="10.5">Cegah palang turun ke mobil</text>
  <text x="494" y="258" fill="#1b5d49" font-family="ui-sans-serif, sans-serif" font-size="11" font-weight="800">Rp10,82 jt</text>

  <!-- Arrow 3->4 -->
  <line x1="673" y1="184" x2="695" y2="184" stroke="#1b5d49" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 4: CCTV & Server -->
  <rect x="700" y="96" width="186" height="176" rx="16" fill="#123c30" stroke="#123c30"/>
  <circle cx="728" cy="124" r="14" fill="#d1b26c"/>
  <text x="728" y="128" text-anchor="middle" fill="#071914" font-family="ui-sans-serif, sans-serif" font-size="11" font-weight="800">04</text>
  <text x="750" y="128" fill="#eadcb9" font-family="ui-sans-serif, sans-serif" font-size="12" font-weight="800">CCTV &amp; Rekaman</text>
  <!-- Icon: CCTV camera -->
  <rect x="742" y="152" width="44" height="22" rx="4" fill="#ffffff"/>
  <polygon points="786,156 802,150 802,176 786,170" fill="#d1b26c"/>
  <circle cx="754" cy="163" r="4" fill="#1b5d49"/>
  <text x="716" y="218" fill="#ffffff" font-family="ui-sans-serif, sans-serif" font-size="11.5" font-weight="700">8 CCTV + NVR 8 Ch</text>
  <text x="716" y="235" fill="#bfd0c7" font-family="ui-sans-serif, sans-serif" font-size="10.5">HDD 2TB + Lisensi ZKBioCV</text>
  <text x="716" y="258" fill="#eadcb9" font-family="ui-sans-serif, sans-serif" font-size="11" font-weight="800">Rp20,41 jt</text>

  <!-- Footer bar: Installation & Dismantle -->
  <rect x="34" y="286" width="852" height="36" rx="10" fill="#e5e8df" stroke="#cfd8d1"/>
  <text x="50" y="308" fill="#123c30" font-family="ui-sans-serif, sans-serif" font-size="11.5" font-weight="800">+ Jasa Instalasi 4 Titik, Kabel &amp; Material, Bongkar 2 Gate Lama, Setting &amp; TestComm:</text>
  <text x="870" y="308" text-anchor="end" fill="#123c30" font-family="Georgia, serif" font-size="14" font-weight="700">Rp29.500.000</text>
</svg>
