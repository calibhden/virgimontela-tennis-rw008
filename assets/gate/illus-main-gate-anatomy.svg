<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="t1 d1">
  <title id="t1">Anatomi Biaya Main Gate Virgimontela</title>
  <desc id="d1">Diagram arsitektural pembagian 4 komponen biaya utama Main Gate Virgimontela dengan total akhir Rp676,5 juta setelah diskon 5 persen.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a241c"/>
      <stop offset="100%" stop-color="#133d30"/>
    </linearGradient>
    <linearGradient id="goldBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c6a152"/>
      <stop offset="100%" stop-color="#ecd8a0"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2dc9b" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#f2dc9b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Card frame -->
  <rect width="920" height="430" rx="22" fill="url(#sky)"/>
  <rect x="1" y="1" width="918" height="428" rx="21" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>

  <!-- Header -->
  <text x="34" y="40" fill="#dfc986" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" letter-spacing="2">ANATOMI BIAYA MAIN GATE · 25 NOV 2026</text>
  <text x="34" y="68" fill="#ffffff" font-family="Georgia, serif" font-size="24">Apa saja yang masuk dalam Rp676,5 juta?</text>
  <rect x="678" y="26" width="208" height="46" rx="12" fill="#d1b26c" fill-opacity="0.14" stroke="#d1b26c" stroke-opacity="0.48"/>
  <text x="782" y="45" text-anchor="middle" fill="#eadcb9" font-family="ui-sans-serif, sans-serif" font-size="10" font-weight="800" letter-spacing="1">SETELAH DISKON 5%</text>
  <text x="782" y="64" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-size="16" font-weight="700">Rp676.511.289</text>

  <!-- Ground & Underground Soil Layer -->
  <rect x="34" y="302" width="852" height="10" fill="#23483c"/>
  <rect x="34" y="312" width="852" height="46" rx="6" fill="#071813" fill-opacity="0.72"/>
  <line x1="34" y1="312" x2="886" y2="312" stroke="#d1b26c" stroke-opacity="0.35" stroke-dasharray="5 5"/>
  <text x="48" y="346" fill="#8fa79c" font-family="ui-sans-serif, sans-serif" font-size="10" font-weight="700">LAPISAN TANAH · 12 PONDASI TAPAK + PEDESTAL (HASIL SONDIR 1,25 m) &amp; 3 SUMUR RESAPAN</text>

  <!-- 6 Footings (representing 12 pad foundations across 2 rows) -->
  <g fill="#5b756a" stroke="#9db5aa" stroke-width="1">
    <rect x="116" y="312" width="22" height="16"/>
    <rect x="108" y="328" width="38" height="9" rx="2"/>
    <rect x="262" y="312" width="22" height="16"/>
    <rect x="254" y="328" width="38" height="9" rx="2"/>
    <rect x="392" y="312" width="136" height="18" rx="2" fill="#3e594f"/>
    <rect x="636" y="312" width="22" height="16"/>
    <rect x="628" y="328" width="38" height="9" rx="2"/>
    <rect x="782" y="312" width="22" height="16"/>
    <rect x="774" y="328" width="38" height="9" rx="2"/>
  </g>

  <!-- Warm downlight cones under canopy -->
  <polygon points="150,185 245,185 260,302 135,302" fill="url(#glow)"/>
  <polygon points="295,185 385,185 395,302 285,302" fill="url(#glow)"/>
  <polygon points="535,185 625,185 635,302 525,302" fill="url(#glow)"/>
  <polygon points="675,185 770,185 785,302 660,302" fill="url(#glow)"/>

  <!-- Main Canopy (Roof + Fascia + LED Strip) -->
  <rect x="86" y="152" width="748" height="10" rx="3" fill="#2d3b36" stroke="#859a90" stroke-width="1"/>
  <rect x="92" y="162" width="736" height="19" rx="2" fill="#dfd5c0"/>
  <rect x="98" y="181" width="724" height="5" fill="url(#goldBar)"/>

  <!-- 4 Main Steel+GRC Columns -->
  <g>
    <rect x="115" y="186" width="24" height="116" fill="#c7b89e" stroke="#6c5942" stroke-width="1.5"/>
    <rect x="122" y="190" width="10" height="108" fill="#efe9dc"/>
    <rect x="261" y="186" width="24" height="116" fill="#c7b89e" stroke="#6c5942" stroke-width="1.5"/>
    <rect x="268" y="190" width="10" height="108" fill="#efe9dc"/>
    <rect x="635" y="186" width="24" height="116" fill="#c7b89e" stroke="#6c5942" stroke-width="1.5"/>
    <rect x="642" y="190" width="10" height="108" fill="#efe9dc"/>
    <rect x="781" y="186" width="24" height="116" fill="#c7b89e" stroke="#6c5942" stroke-width="1.5"/>
    <rect x="788" y="190" width="10" height="108" fill="#efe9dc"/>
  </g>

  <!-- Central Security Booth with WPC vertical louvers & glass -->
  <rect x="394" y="186" width="132" height="116" fill="#21352d" stroke="#c8b48e" stroke-width="1.5"/>
  <!-- Upper WPC Louvers -->
  <g stroke="#d4be90" stroke-width="3">
    <line x1="404" y1="188" x2="404" y2="230"/>
    <line x1="414" y1="188" x2="414" y2="230"/>
    <line x1="424" y1="188" x2="424" y2="230"/>
    <line x1="434" y1="188" x2="434" y2="230"/>
    <line x1="444" y1="188" x2="444" y2="230"/>
    <line x1="454" y1="188" x2="454" y2="230"/>
    <line x1="464" y1="188" x2="464" y2="230"/>
    <line x1="474" y1="188" x2="474" y2="230"/>
    <line x1="484" y1="188" x2="484" y2="230"/>
    <line x1="494" y1="188" x2="494" y2="230"/>
    <line x1="504" y1="188" x2="504" y2="230"/>
    <line x1="514" y1="188" x2="514" y2="230"/>
  </g>
  <!-- Glass service window -->
  <rect x="404" y="234" width="112" height="36" rx="2" fill="#89b8a9" fill-opacity="0.32" stroke="#d9e7e1" stroke-width="1.2"/>
  <text x="460" y="256" text-anchor="middle" fill="#e6f2ec" font-family="ui-sans-serif, sans-serif" font-size="10" font-weight="700">POS TENGAH · AC 1 PK</text>
  <!-- Lower WPC louvers -->
  <g stroke="#b69e72" stroke-width="2.5">
    <line x1="404" y1="274" x2="404" y2="300"/>
    <line x1="416" y1="274" x2="416" y2="300"/>
    <line x1="428" y1="274" x2="428" y2="300"/>
    <line x1="440" y1="274" x2="440" y2="300"/>
    <line x1="452" y1="274" x2="452" y2="300"/>
    <line x1="464" y1="274" x2="464" y2="300"/>
    <line x1="476" y1="274" x2="476" y2="300"/>
    <line x1="488" y1="274" x2="488" y2="300"/>
    <line x1="500" y1="274" x2="500" y2="300"/>
    <line x1="512" y1="274" x2="512" y2="300"/>
  </g>

  <!-- 4 Lane Labels -->
  <g font-family="ui-sans-serif, sans-serif" font-size="9.5" font-weight="800" text-anchor="middle" fill="#b7cbc1">
    <text x="198" y="293">MASUK WARGA</text>
    <text x="339" y="293">MASUK TAMU</text>
    <text x="580" y="293">KELUAR TAMU</text>
    <text x="720" y="293">KELUAR WARGA</text>
  </g>

  <!-- Callout Pins on Elevation -->
  <!-- Pin 1: Decoration (47%) -->
  <line x1="460" y1="186" x2="460" y2="118" stroke="#eadcb9" stroke-width="1.4" stroke-dasharray="3 3"/>
  <circle cx="460" cy="186" r="5" fill="#d1b26c"/>
  <rect x="330" y="88" width="260" height="36" rx="10" fill="#173f32" stroke="#d1b26c" stroke-opacity="0.7"/>
  <text x="460" y="104" text-anchor="middle" fill="#eadcb9" font-family="ui-sans-serif, sans-serif" font-size="10" font-weight="800">III · DEKORASI &amp; FASAD (47%)</text>
  <text x="460" y="118" text-anchor="middle" fill="#ffffff" font-family="ui-sans-serif, sans-serif" font-size="11" font-weight="700">Rp334,4 jt · Kisi WPC, GRC, Plafon &amp; Kaca</text>

  <!-- Pin 2: Civil & Steel (39%) -->
  <line x1="127" y1="152" x2="127" y2="118" stroke="#9ec4b6" stroke-width="1.4" stroke-dasharray="3 3"/>
  <circle cx="127" cy="152" r="5" fill="#7ab8a3"/>
  <rect x="34" y="88" width="266" height="36" rx="10" fill="#123228" stroke="#7ab8a3" stroke-opacity="0.7"/>
  <text x="167" y="104" text-anchor="middle" fill="#9cd3bf" font-family="ui-sans-serif, sans-serif" font-size="10" font-weight="800">II · SIPIL, BAJA &amp; ATAP (39%)</text>
  <text x="167" y="118" text-anchor="middle" fill="#ffffff" font-family="ui-sans-serif, sans-serif" font-size="11" font-weight="700">Rp280,7 jt · Baja WF 3,6t, Pondasi, Alderon</text>

  <!-- Pin 3: ME & Lighting (9%) -->
  <line x1="740" y1="183" x2="740" y2="118" stroke="#f2dc9b" stroke-width="1.4" stroke-dasharray="3 3"/>
  <circle cx="740" cy="183" r="5" fill="#f2dc9b"/>
  <rect x="620" y="88" width="266" height="36" rx="10" fill="#123228" stroke="#f2dc9b" stroke-opacity="0.65"/>
  <text x="753" y="104" text-anchor="middle" fill="#f2dc9b" font-family="ui-sans-serif, sans-serif" font-size="10" font-weight="800">IV · LISTRIK, LED &amp; AC (9%)</text>
  <text x="753" y="118" text-anchor="middle" fill="#ffffff" font-family="ui-sans-serif, sans-serif" font-size="11" font-weight="700">Rp61,5 jt · 36 Downlight, 108m LED, AC 1PK</text>

  <!-- Bottom Stacked Proportional Bar -->
  <text x="34" y="382" fill="#bfd0c7" font-family="ui-sans-serif, sans-serif" font-size="10" font-weight="800" letter-spacing="1">KOMPOSISI SEBELUM DISKON (Rp712,1 jt) → DISKON 5% (−Rp35,6 jt) → FINAL Rp676,5 jt</text>
  <!-- Bar width = 852px: I=5% (43), II=39.4% (336), III=47% (400), IV=8.6% (73) -->
  <rect x="34" y="392" width="43" height="16" rx="4" fill="#6f877d"/>
  <rect x="81" y="392" width="332" height="16" rx="4" fill="#3a866d"/>
  <rect x="417" y="392" width="396" height="16" rx="4" fill="#d1b26c"/>
  <rect x="817" y="392" width="69" height="16" rx="4" fill="#f1dc9c"/>
  <text x="55" y="404" text-anchor="middle" fill="#071914" font-family="ui-sans-serif, sans-serif" font-size="9" font-weight="800">5%</text>
  <text x="247" y="404" text-anchor="middle" fill="#ffffff" font-family="ui-sans-serif, sans-serif" font-size="10" font-weight="800">Sipil &amp; Struktur 39%</text>
  <text x="615" y="404" text-anchor="middle" fill="#071914" font-family="ui-sans-serif, sans-serif" font-size="10" font-weight="800">Dekorasi &amp; Fasad 47%</text>
  <text x="851" y="404" text-anchor="middle" fill="#071914" font-family="ui-sans-serif, sans-serif" font-size="9" font-weight="800">ME 9%</text>
</svg>
